[package]
name = "cpp_formatter"
version = "0.1.3"
edition = "2024"
description = "A C++ formatter with clang-format's configuration surface."
license = "MIT"
authors = ["CppCXY"]
repository = "https://github.com/CppCXY/cpp_ls"
keywords = ["cpp", "language-server"]
categories = ["development-tools"]

[[bin]]
name = "cppfmt"
path = "src/main.rs"

[lib]
name = "cpp_formatter"
path = "src/lib.rs"

[dependencies]
# The token stream and the tree that settles what a token *is* (`int *p` vs `a * b`).
cpp_parser.workspace = true
