[package]
name = "cpp_code_analysis"
version = "0.1.0"
edition = "2024"

[dependencies]
cpp_parser.workspace = true

# **The decisions this layer makes are invisible from outside it**, and a report that says "completion and the hints
# come and go" cannot be answered from the LSP layer alone: whether a callee resolved, whether its parameter list was
# readable, and which of the four ways a call produces no hint are all decided here, in `inlay` and `index::project`.
# The alternative is a signature that returns its own diagnosis, which is a worse shape for every other caller.
#
# Already in the graph — `cpp_ls` logs through it — so this is a dependency edge rather than a new crate.
log.workspace = true

# `WatchFilter` ignores paths by *pattern* as well as by directory (`**/build/**`, `*.generated.h`): which trees a
# project considers its own source is a convention no analysis can guess, so a caller says it — and a caller with a
# configuration file has a glob in its hand, not a directory.
glob.workspace = true

# The project's own configuration file. `serde` is already in the graph (`cpp_parser` derives a `Serialize` for
# `CppSyntaxId`), and `toml` is the parser for it — a file a user hand-writes gets a real parser rather than a
# subset that silently ignores what it cannot read.
rust-i18n.workspace = true
serde.workspace = true
redb.workspace = true
zstd.workspace = true
toml.workspace = true
[dev-dependencies]
# **The memory probe measures the allocator the server actually uses.** `cpp_ls` installs mimalloc as its global
# allocator, and the question `docs/memory-audit.md` asks — "is the resident set the live tables or pages the
# allocator is holding" — cannot be answered with a different allocator underneath. Both crates are already in the
# dependency graph (through `cpp_ls`), so this is an edge rather than a new download.
mimalloc = { version = "0.1", default-features = false }
libmimalloc-sys = "0.1"