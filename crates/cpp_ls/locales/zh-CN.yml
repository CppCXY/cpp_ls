# 中文（zh-CN）—— 与 en.yml 同一组 key。缺哪个 key，那个词条就回落到英文（rust-i18n 的 fallback），
# 所以这张表可以逐条补齐，不必一次写全。
#
# 体例：一条讲"是什么"，必要的话再补一句"要知道的事"。弹窗是一眼扫过就关掉的东西，第二句留给正在核对规则的人。
keyword:
  auto: "**`auto`** —— 由初始化器推导这个声明本身的类型。\n\n推导结果是初始化器的类型去掉顶层 `const` 和引用：`const int& r = x; auto v = r;` 得到的是 `int`。要保留它们就写 `auto&` 或 `const auto&`。"
  bool: "**`bool`** —— `true` 或 `false`。\n\n它可以和 `int` 互相转换（`false` 是 0，`true` 是 1），但那个转换不是这个类型的意思：`bool` 参数说的是「是或否」，`int` 参数说的不是。"
  break: "**`break`** —— 离开最近的 `for`、`while`、`do` 或 `switch`。\n\n是整个循环结束，不是当前这一轮结束 —— 后者是 `continue`。"
  case: "**`case`** —— `switch` 里的一个标号。\n\n标号会和被 switch 的值比较；故意不写 `break` 让它接着走下一个分支是合法的写法（`case 'a': case 'b':`），不是笔误。"
  catch: "**`catch`** —— 处理对应 `try` 块抛出的异常。\n\n`catch (...)` 接住一切；通常写 `catch (const std::exception& e)`，因为按值捕获会把异常对象切片。"
  char: "**`char`** —— 一个字节，符号性由实现决定。\n\n用它表示字符。表示字节用 `unsigned char`/`std::byte`，要参与算术用 `int8_t`/`uint8_t`。"
  class: "**`class`** —— 用户定义类型，成员默认是 **private**。\n\n它和 `struct` 唯一的区别就是这个默认访问级别，以及默认的继承方式。"
  const: "**`const`** —— 通过这个声明不能修改这个名字。\n\n用在指针上时，它可能修饰所指对象（`const int*`），也可能修饰指针本身（`int* const`）—— 由 `*` 的位置决定。"
  constexpr: "**`constexpr`** —— 这个值或函数可以在编译期求值。\n\n用在变量上它同时意味着 `const`。用在函数上它只是给编译器的许可，不是要求：`constexpr` 函数在运行时照样可以调用。"
  consteval: "**`consteval`** —— 这个函数必须在编译期求值。\n\n和 `constexpr` 不同，不能编译期求值的调用是错误。"
  constinit: "**`constinit`** —— 这个变量在编译期完成初始化，但它不是 `const`。\n\n它排除静态初始化顺序问题，又不拿走修改值的能力。"
  continue: "**`continue`** —— 结束最近这层循环的当前一轮，直接进入下一轮。"
  decltype: "**`decltype(expr)`** —— 这个表达式声明的类型，原样返回。\n\n`decltype((x))` 对变量给的是 `T&`，而 `decltype(x)` 是 `T` —— 那对括号是问题的一部分。"
  default: "**`default`** —— `switch` 的另一个标号；或者让编译器替你写这个成员（`= default`）。"
  delete: "**`delete`** —— 销毁 `new` 出来的对象，或把一个函数标记为不可用（`= delete`）。\n\n`delete[]` 配 `new[]`；配错是未定义行为。"
  do: "**`do` … `while (cond);`** —— 先执行循环体再读条件，所以至少执行一次。"
  else: "**`else`** —— `if` 条件为假时走的分支。"
  enum: "**`enum`** —— 一个独立类型，取值是一组具名常量。\n\n`enum class E` 把名字关在作用域里（`E::V`）并且不隐式转 `int`；裸 `enum E` 两样都能，写它就是选择了这点。"
  explicit: "**`explicit`** —— 这个构造函数不参与隐式转换，这个转换函数不被隐式调用。\n\nC++20 里 `explicit(false)` 表达相反的情况，当这件事由条件决定时。"
  extern: "**`extern`** —— 这个名字在另一个翻译单元里定义（`extern int n;`），或者这个块使用 C 链接（`extern \"C\" { … }`）。"
  false: "**`false`** —— `bool` 的 0。"
  float: "**`float`** —— 单精度浮点数，通常 32 位。\n\n精度有所谓的地方，C++ 的默认选择是 `double`。"
  for: "**`for`** —— 计数循环（`for (init; cond; step)`）、范围循环（`for (T x : range)`），或者模板里的折叠表达式。"
  friend: "**`friend`** —— 这个声明可以访问它所在类的非公有成员。\n\n友元是授予的，不能夺取，也不被继承。"
  goto: "**`goto`** —— 跳到本函数内的某个标号。\n\n它不能跳过初始化，所以除了生成的代码和清理块，很少见到。"
  if: "**`if`** —— 条件为真时执行一条语句。\n\nC++17 起条件里可以带初始化器：`if (auto it = m.find(k); it != m.end())`。"
  inline: "**`inline`** —— 这个函数或变量可以在多个翻译单元里定义。\n\n用在函数上它同时是内联的提示（编译器可以不理）；用在变量上，它才是让头文件里的定义合法的那件事（或者写 `inline constexpr`）。"
  mutable: "**`mutable`** —— 即使在 `const` 成员函数里，这个成员也允许被修改。\n\n留给缓存和锁，不要留给读者会当成「值的一部分」的状态。"
  namespace: "**`namespace`** —— 给名字划一个作用域。\n\n具名命名空间可以在多处重新打开；匿名命名空间只属于它所在的翻译单元，这正是过去文件作用域 `static` 的意思。"
  noexcept: "**`noexcept`** —— 这个函数承诺不让异常跑出去。\n\n违背承诺会调用 `std::terminate`；这个承诺同时是类型的一部分，也参与重载决议（`void f() noexcept` 和 `void f()` 是两个类型）。"
  nullptr: "**`nullptr`** —— 空指针字面量，类型是 `std::nullptr_t`。\n\n和 `0` 或 `NULL` 不同，它能转成任何指针类型，也不会转成整数类型 —— 这就是那些重载歧义消失的原因。"
  operator: "**`operator`** —— 这个函数定义某个运算符对这个类型的含义（或执行一次显式转换）。"
  private: "**`private`** —— 其后的成员只有本类（和它的友元）能访问。"
  protected: "**`protected`** —— 其后的成员只有本类、派生类和友元能访问。"
  public: "**`public`** —— 其后的成员到处都能访问。"
  register: "**`register`** —— 建议把变量放在寄存器里的存储类提示。\n\nC++11 起弃用，C++17 起移除；保留它只是为兼容。"
  return: "**`return`** —— 离开函数，并给出这个值（`void` 函数则不给）。\n\n`return {1, 2};` 和 `return T{…};` 直接构造返回值，而不是复制一份。"
  short: "**`short`** —— 至少 16 位的有符号整数（通常是恰好 16 位）。"
  signed: "**`signed`** —— 后面那个整数类型的有符号版本；单独写 `signed` 就是 `int`。"
  sizeof: "**`sizeof`** —— 一个类型或表达式占的字节数，类型是 `size_t`，表达式不会被求值。"
  static: "**`static`** —— 文件作用域：这个名字内部链接；函数内：所有调用共用一个对象；类内：这个成员属于类而不是某个对象。"
  static_assert: "**`static_assert`** —— 编译程序时检查的条件。\n\nC++17 起说明文字是第二个参数（`static_assert(sizeof(T) == 4, \"T 必须是 4 字节\")`）。"
  static_cast: "**`static_cast<T>(x)`** —— 由编译器检查的转换，没有运行时判定。\n\n读者预期的那个转换：`double` 到 `int`、指针沿继承体系向上、`void*` 转回有类型的指针。"
  struct: "**`struct`** —— 用户定义类型，成员默认是 **public**，默认也是公开继承。"
  switch: "**`switch`** —— 按值比较，选中一个 `case`。\n\n每个分支用 `break` 结束；不写就接着走下一个 case，偶尔那正是代码想要的。"
  template: "**`template`** —— 这个声明是一个模式，用使用处给出的实参实例化。"
  this: "**`this`** —— 指向成员函数被调用时那个对象的指针；`*this` 是对象本身。\n\n在 `const` 成员函数里它是 `const T*`，这就是为什么里面不能调用非 const 成员函数。"
  throw: "**`throw`** —— 抛出异常，并在离开时结束这个函数。\n\n`throw;` 重新抛出正在处理的那个异常；`noexcept` 函数不许抛出。"
  true: "**`true`** —— `bool` 的 1。"
  try: "**`try`** —— 这个块里的异常可以由下面的 `catch` 处理。\n\n函数 try 块还能接住成员初始化器抛出的异常。"
  typedef: "**`typedef`** —— 类型的别名，写作 `typedef T Name;`。\n\n`using Name = T;` 是同一件事，只是从左往右读，而且能用于模板。"
  typename: "**`typename`** —— 后面那个限定名是一个类型（模板里的依赖名），或者这个模板参数是类型参数。"
  union: "**`union`** —— 成员共用同一块存储的类型。\n\n读取最后写入之外的那个成员是未定义行为（公共初始序列除外）；C++17 的 `std::variant` 是安全写法。"
  unsigned: "**`unsigned`** —— 后面那个整数类型的无符号版本；单独写 `unsigned` 就是 `unsigned int`。\n\n无符号算术会回绕、不会溢出，所以用有符号的 `i` 去比 `v.size()` 是真实的 bug。"
  using: "**`using`** —— 类型别名（`using Name = T;`）、using 声明（`using ns::f;`）、using 指令（`using namespace ns;`），或 using enum。"
  virtual: "**`virtual`** —— 这个成员函数可以被派生类覆盖，调用解析到对象的动态类型。\n\n`virtual` 加 `= 0` 让这个类变成抽象类。"
  void: "**`void`** —— 没有值的类型：不返回东西的函数，或者指向未知类型的 `void*`。"
  volatile: "**`volatile`** —— 对这个对象的每次访问都是真实的读或写，硬件寄存器和 `sig_atomic_t` 需要这个。\n\n它不是线程间同步的工具；那件事用原子类型。"
  while: "**`while`** —— 每轮开始时先判断条件的循环。"

command:
  brief: "**`@brief`** —— 被文档化实体的一句话概括。\n\n写作 `@brief 文字`，或者直接写第一段而不带命令。"
  short: "**`@short`** —— 简短描述，`@brief` 的同义词。"
  details: "**`@details`** —— 详细描述，写在 brief 之后。"
  return: "**`@return`** —— 函数返回什么。\n\n写这个值**意味着**什么，以及在什么条件下产生。"
  returns: "**`@returns`** —— `@return` 的同义词。"
  result: "**`@result`** —— `@return` 的同义词。"
  param: "**`@param`** —— 描述一个形参：`@param 名字 说明`。\n\n方向可以写成 `@param[in]`、`@param[out]`、`@param[in,out]`，Doxygen 会据此检查每个形参是否都被描述。"
  tparam: "**`@tparam`** —— 描述一个模板参数：`@tparam T 说明`。"
  exception: "**`@exception`** —— 描述这个函数可能抛出的异常：`@exception 类型 何时`。"
  throws: "**`@throws`** —— `@exception` 的同义词。"
  note: "**`@note`** —— 读者必须知道的事，独立于描述正文。"
  warning: "**`@warning`** —— 危险：会在什么时候、出什么问题。"
  attention: "**`@attention`** —— 提醒注意；比 `@note` 更强。"
  deprecated: "**`@deprecated`** —— 这个实体已废弃。\n\n写清楚它被什么替代：弹窗是读者唯一能知道该改去哪里的地方。"
  since: "**`@since`** —— 这个实体从哪个版本开始有。"
  see: "**`@see`** —— 交叉引用另一个实体，写名字或 `#成员`。"
  sa: "**`@sa`** —— `@see` 的同义词。"
  ref: "**`@ref`** —— 链接到另一个被文档化的实体，`@ref Item \"文字\"`。"
  file: "**`@file`** —— 这条注释描述的是文件，不是它后面的声明。"
  author: "**`@author`** —— 谁写的。"
  date: "**`@date`** —— 写于或改于何时。"
  version: "**`@version`** —— 这个实体的版本。"
  copyright: "**`@copyright`** —— 使用的许可。"
  todo: "**`@todo`** —— 还没做的事。"
  bug: "**`@bug`** —— 已知缺陷，就在代码处说明。"
  test: "**`@test`** —— 这个实体的测试检查什么。"
  example: "**`@example`** —— 一个示范这个实体用法的文件。"
  code: "**`@code`** —— 接下来的行是代码，直到 `@endcode`。\n\n原样保留，所以缩进和代码里的注释都在。"
  endcode: "**`@endcode`** —— 结束 `@code` 打开的块。"
  verbatim: "**`@verbatim`** —— 接下来的行原样保留，直到 `@endverbatim`。"
  endverbatim: "**`@endverbatim`** —— 结束 `@verbatim` 打开的块。"
  pre: "**`@pre`** —— 前置条件：调用之前必须成立的事。"
  post: "**`@post`** —— 后置条件：调用之后保证成立的事。"
  invariant: "**`@invariant`** —— 对象整个生命周期里始终成立的事。"
  group: "**`@group`** —— 把这个实体加进一个具名的文档组。"
  ingroup: "**`@ingroup`** —— 这个实体属于某个已有的组。"
  name: "**`@name`** —— 开始一个成员组并给它标题；`@{` … `@}` 界定范围。"
  namespace: "**`@namespace`** —— 这条注释描述一个命名空间。"
  class: "**`@class`** —— 这条注释描述一个类，当它无法写在类旁边时。"
  struct: "**`@struct`** —— 这条注释描述一个 struct。"
  enum: "**`@enum`** —— 这条注释描述一个枚举。"
  fn: "**`@fn`** —— 这条注释描述一个函数，当它无法写在函数旁边时。"
  var: "**`@var`** —— 这条注释描述一个变量。"
  def: "**`@def`** —— 这条注释描述一个 `#define`。"
  typedef: "**`@typedef`** —— 这条注释描述一个类型别名。"
  mainpage: "**`@mainpage`** —— 文档首页的正文。"
  section: "**`@section`** —— 开始一个具名小节：`@section intro 介绍`。"
  subsection: "**`@subsection`** —— 小节里的小节。"
  page: "**`@page`** —— 开始文档里一个独立页面。"
  internal: "**`@internal`** —— 这个实体不属于公开接口。\n\n`INTERNAL_DOCS` 关闭时被排除，这正是它适合标记实现细节的原因。"
  public: "**`@public`** —— 明确属于公开接口。"
  private: "**`@private`** —— 明确是实现细节。"
  cond: "**`@cond`** —— 只有命名条件成立时才包含这段文档，直到 `@endcond`。"
  endcond: "**`@endcond`** —— 结束 `@cond` 打开的块。"
  dot: "**`@dot`** —— 接下来的行是一张 graphviz `dot` 图，直到 `@enddot`。"
  enddot: "**`@enddot`** —— 结束 `@dot` 打开的块。"
  image: "**`@image`** —— 文档里的一张图：`@image html file.png \"说明\"`。"
  li: "**`@li`** —— 列表里的一项。"
  arg: "**`@arg`** —— 列表里的一项，同 `@li`。"
# 文档注释里的命令在 hover 中显示时使用的**标签**。刻意很短：它出现在作者写的正文旁边，而不是取代正文。
doc:
  returns: "返回"
  note: "注意"
  warning: "警告"
  attention: "注意"
  see: "参见"
  deprecated: "已弃用"
  todo: "待办"
  parameter: "参数"
# CUDA — the vocabulary of a CUDA project. See the English file for what each entry is and why the keys are flat.
cuda:
  __global__: "**`__global__`** — 核函数：从主机调用，在设备上运行。\n\n核函数返回 `void`，用 `kernel<<<grid, block>>>(args)` 启动，并且**每个线程运行一次**：同一个函数体就是每个线程的体。在它里面，`threadIdx`、`blockIdx`、`blockDim`、`gridDim` 说明当前是哪个线程。\n\n它不能是类的成员，也不能像函数那样调用——启动括号才是那次调用。"
  __device__: "**`__device__`** — 在设备上运行：可以被核函数或另一个 `__device__` 函数调用。\n\n没有任何限定符的函数是 `__host__`，在 CPU 上运行。写在成员函数上时，它限定的是那个函数，之后这个类就可以在设备代码里使用。"
  __host__: "**`__host__`** — 在主机上运行：普通函数，为 CPU 编译。\n\n它是默认值，所以只在另外两个出现的地方才写：`__host__ __device__` 表示两份函数体都编译，由编译器在每个调用点选择。"
  __shared__: "**`__shared__`** — 块内共享的共享内存临时数组。\n\n共享内存在多处理器上，所以一个块的每个线程几个周期就能读到；块与块之间不共享。一个块的 `__shared__` 数组就是整个块的一个数组，碰它的每个线程必须对“哪个元素”达成一致——按 `threadIdx` 索引正是它的意义。\n\n在核函数内部声明，大小必须是启动时已知的常量：`__shared__ float tile[16][16];`。"
  __constant__: "**`__constant__`** — 只读的设备内存，由主机在启动前写入。\n\n有缓存且会广播：一个 warp 的线程读同一个地址只花一次读。核函数的参数本质上是同一种东西，只是不必声明，这也是小参数直接传而不复制的理由。"
  __managed__: "**`__managed__`** — 主机和设备都能访问的内存，按需迁移。\n\n带这个限定符的全局变量可以在任何一侧写，CUDA 负责搬页。小表用起来方便，但比选定一侧要慢。"
  __grid_constant__: "**`__grid_constant__`** — 核函数参数，由整个网格共享一份，而不是每个线程一份。\n\n没有它，大参数会复制进每个线程的栈；有了它，整个网格看到同一个只读对象。"
  __restrict__: "**`__restrict__`** — 这个指针没有别名，等价于 C 的 `restrict`。\n\n这是在承诺没有别的名字写同一块内存，编译器因此可以重排和向量化访存。承诺不成立就是未定义行为。"
  __launch_bounds__: "**`__launch_bounds__(maxThreadsPerBlock[, minBlocksPerMultiprocessor])`** — 核函数按什么启动形状编译。\n\n它约束寄存器和展开：`__launch_bounds__(1024)` 表示不会有超过 1024 个线程的块，于是编译器可以少用每线程寄存器；第二个参数要求每个多处理器至少驻留这么多个块。"
  __maxnreg__: "**`__maxnreg__(n)`** — 这个核函数的每个线程最多用多少个寄存器。\n\n调低意味着更多驻留块和更多溢出；这是调优参数，不是正确性参数。"
  __align__: "**`__align__(n)`** — 声明的对齐，等价于 C++ 的 `alignas`。\n\n对于工具链要复制的结构值得写：非对齐的向量读取既慢，某些路径上还非法。"
  __cluster_dims__: "**`__cluster_dims__(x, y, z)`** — 这个核函数启动时线程块簇的形状。\n\n簇是一组可以共享分布式共享内存的块；在没有簇的硬件上这个限定符是编译期错误。"
  __forceinline__: "**`__forceinline__`** — 强制内联这个函数，等价于 C++17 放宽语义之前的 `inline`。"
  __noinline__: "**`__noinline__`** — 永不内联这个函数。\n\n用来把一个 device 函数挡在热点核函数的寄存器预算之外。"
  threadIdx: "**`threadIdx`** — 当前线程在它所在块内的下标，`dim3`。\n\n核函数第一个读的值：`unsigned i = threadIdx.x + blockIdx.x * blockDim.x;` 就是这个线程在网格里的平坦下标。`.y`、`.z` 存在是因为块可以按二维、三维启动。"
  blockIdx: "**`blockIdx`** — 当前块在网格内的下标，`dim3`。\n\n在用它索引之前先做边界检查：`if (blockIdx.x < n)` 正是让最后一个不满的块不会读过数组末尾的那一句。"
  blockDim: "**`blockDim`** — 这个块里的线程数，`dim3`。\n\n它是启动配置里 `block` 那一半：`kernel<<<2, 128>>>` 让每个块拿到 `blockDim.x` 为 128。"
  gridDim: "**`gridDim`** — 网格里的块数，`dim3`——启动配置里 `grid` 那一半。"
  warpSize: "**`warpSize`** — 一个 warp 里的线程数：至今所有 NVIDIA GPU 都是 32。\n\n设备函数可以读它；写死 32 的核函数今天是对的，等到硬件变化那天就错了，这就是该写 `warpSize` 的原因。"
  dim3: "**`dim3`** — 三个无符号分量 `.x .y .z`，缺省为 1。\n\n启动配置就是用它写的：`kernel<<<dim3(2, 1), 128>>>` 表示 `x` 方向两个块、每块 128 个线程。直接写 `128` 等价于 `dim3(128, 1, 1)`。"
  __half: "**`__half`** — 16 位浮点值，由 `cuda_fp16.h` 声明。\n\n占 `float` 一半的内存，也是张量核心想要的算术；主机侧同一个类型叫 `_Float16` 或库类型，所以它基本上是设备侧类型。"
  __half2: "**`__half2`** — 一个 32 位字里打包两个 `__half`，一次对两者做算术（`cuda_fp16.h`）。"
  __nv_bfloat16: "**`__nv_bfloat16`** — 16 位 brain float：指数 8 位像 `float`，尾数 7 位（`cuda_bf16.h`）。\n\n相比 `__half` 选它是为了范围而不是精度：用它不需要 loss scaling。"
  vector_char: "**`char1`、`char2`、`char3`、`char4`** — 一到四个有符号 8 位整数，分量 `.x`、`.y`、`.z`、`.w`。\n\n这些编号家族是工具链的向量类型：核函数的访存按它们对齐，纹理和 `float4` 拷贝也一次搬一个。`3` 在内存里被填充成四个分量，所以 `char3` 数组和 `char4` 数组一样贵。"
  vector_uchar: "**`uchar1` … `uchar4`** — 一到四个无符号 8 位整数，分量 `.x` … `.w`。"
  vector_short: "**`short1` … `short4`** — 一到四个有符号 16 位整数，分量 `.x` … `.w`。"
  vector_ushort: "**`ushort1` … `ushort4`** — 一到四个无符号 16 位整数，分量 `.x` … `.w`。"
  vector_int: "**`int1` … `int4`** — 一到四个有符号 32 位整数，分量 `.x` … `.w`。\n\n`int4` 是 16 字节：一次向量读取，这就是用它的理由。"
  vector_uint: "**`uint1` … `uint4`** — 一到四个无符号 32 位整数，分量 `.x` … `.w`。"
  vector_long: "**`long1` … `long4`** — 一到四个 `long`，分量 `.x` … `.w`。\n\n宽度是平台的：Windows 上 32 位，Linux 上 64 位。永远 64 位的写法是 `longlong`。"
  vector_ulong: "**`ulong1` … `ulong4`** — 一到四个 `unsigned long`，分量 `.x` … `.w`。"
  vector_longlong: "**`longlong1` … `longlong4`** — 一到四个有符号 64 位整数，分量 `.x` … `.w`。"
  vector_ulonglong: "**`ulonglong1` … `ulonglong4`** — 一到四个无符号 64 位整数，分量 `.x` … `.w`。"
  vector_float: "**`float1` … `float4`** — 一到四个 32 位浮点，分量 `.x` … `.w`。\n\n`float4` 是访存受限核函数的主力：每个线程每次访问 16 个对齐字节，正是硬件最喜欢的形状。"
  vector_double: "**`double1` … `double4`** — 一到四个 64 位浮点，分量 `.x` … `.w`。\n\n除专用单元外，设备做 `double` 的速度只是 `float` 的一小部分；需要精确算术的核函数仍然需要它。"
