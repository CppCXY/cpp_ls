[package]
name = "cpp_parser"
version = "0.1.0"
edition = "2024"
description = "A lossless C++ parser over the preprocessed text: the tree every layer above it reads."
license = "MIT"
authors = ["CppCXY"]
repository = "https://github.com/CppCXY/cpp_ls"
keywords = ["cpp", "language-server"]
categories = ["development-tools"]

[[bin]]
name = "cpp_dump"
path = "src/bin/main.rs"

[dependencies]
rowan.workspace = true
rust-i18n.workspace = true
serde.workspace = true
unicode-ident.workspace = true
