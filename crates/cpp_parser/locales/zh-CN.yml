# 中文 —— 解析错误的文案。key 是**英文原文本身**，所以 `en` 不需要文件：缺 key 时返回 key，那正是英文。
#
# 一条一条照着 `cpp_parser` 里 `&t!("…")` 的原文写：key 差一个字符，rust-i18n 就安静地回英文，
# 表现和"没翻译"一模一样 —— 这是这张表唯一容易犯的错。
