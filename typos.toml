[files]
extend-exclude = [
  "CHANGELOG.md",
  "*.flake",
  "*.yaml",
  "*test.rs",          # 已覆盖 test.rs，无需单独列出
  "open-questions.md",
  # "target/",         # 按需添加目录排除
]

[default]
extend-ignore-re = [
  # Git commit hash in CHANGELOG.md
  "\\[[0-9a-f]{7}\\]",
  # 行尾禁用注释（保留你实际使用的注释风格即可）
  "(?Rm)^.*(#|--|//)\\s*spellchecker:disable-line$",
  # 如果 typ 正则过于宽泛，建议移除或改为精确的 extend-words 条目
  # "(?i)\\b(?:\\w*typ|typ_\\w*)\\b",
]

[default.extend-words]
mis = "mis"
PARM = "PARM"
Iinclude = "Iinclude"
seh = "seh"
SEH = "SEH"
nd = "nd"
gam = "gam"
