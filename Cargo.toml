[workspace]
resolver = "2"
members = [
    "crates/*",
]

# Every entry here is used by at least one crate. The table was inherited from the Lua project this server's shell
# came from and carried twenty crates nothing referenced (`notify`, `walkdir`, `dirs`, `tera`, `schemars`,
# `internment`, `toml_edit`, …); they are gone, and an entry that no `Cargo.toml` names is a dependency a reader
# has to check rather than trust. See `docs/ls-architecture.md` §5.
[workspace.dependencies]
# local
cpp_parser = { path = "crates/cpp_parser" }
cpp_code_analysis = { path = "crates/cpp_code_analysis" }

# external
lsp-server = "0.10.0"
lsp_types = { version = "0.1.0", package = "emmy_lsp_types" }
tokio = { version = "1.53", features = ["full"] }
tokio-util = "0.7.19"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
rowan = { version = "0.17.0" }
glob = "0.3"
# `.cppls.toml` is a file a user writes by hand: it gets a real TOML parser, not a subset that silently ignores
# what it cannot read. See `docs/ls-architecture.md` §5 and `crates/cpp_code_analysis/src/project/config.rs`.
toml = "0.8"
percent-encoding = "2.3"
log = "0.4.33"
fern = "0.7.1"
chrono = "0.4.45"
clap = { version = "4.6.1", features = ["derive", "wrap_help"] }
# The parser's own error messages are localized (`t!` in its grammar rules); this is the parser's dependency and
# not the server's.
rust-i18n = "3"
unicode-ident = "1.0.26"
