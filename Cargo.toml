[workspace]
resolver = "2"
members = [
    "crates/*",
    "tools/*"
]

# **The one style rule this project states for paths**: a path is written with the shortest name that still
# resolves — `CppSyntaxKind`, not `cpp_parser::CppSyntaxKind` — and the compiler is what decides. `unused_qualifications`
# fires exactly when the shorter form names the same item, so an ambiguity (two `Display`s, a shadowed name) is
# never flagged and an enum variant keeps its qualifier (`Style::Fallback` stays `Style::Fallback`: the variants are
# not in scope). The lint is allow-by-default only because it is noisy in a tree that has not adopted it; here it is
# the rule, and `-D warnings` in CI is what enforces it.
[workspace.lints.rust]
unused_qualifications = "warn"

# Every entry here is used by at least one crate. The table was inherited from the Lua project this server's shell
# came from and carried twenty crates nothing referenced (`walkdir`, `dirs`, `tera`, `schemars`,
# `internment`, `toml_edit`, …); they are gone, and an entry that no `Cargo.toml` names is a dependency a reader
# has to check rather than trust.
[workspace.dependencies]
# local
cpp_parser = { path = "crates/cpp_parser", version = "0.5.0" }
cpp_toolchain = { path = "crates/cpp_toolchain", version = "0.5.0" }
cpp_formatter = { path = "crates/cpp_formatter", version = "0.5.0" }
cpp_code_analysis = { path = "crates/cpp_code_analysis", version = "0.5.0" }
cpp_ls = { path = "crates/cpp_ls", version = "0.5.0" }

# external
lsp-server = "0.10.0"
lsp_types = { version = "0.1.0", package = "emmy_lsp_types" }
tokio = { version = "1.54", features = ["full"] }
tokio-util = "0.7.20"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
rowan = { version = "0.17.0" }
glob = "0.3"
notify = "9"
toml = "1.2.2"
percent-encoding = "2.3"
log = "0.4.35"
fern = "0.7.1"
chrono = "0.4.45"
redb = "4.4.0"
zstd = "0.13"
clap = { version = "4.6.9", features = ["derive", "wrap_help"] }
rust-i18n = "3"
unicode-ident = "1.0.27"
mimalloc-safe = "0.1.71"
smol_str = { version = "0.3.7", features = ["serde"] }
rustc-hash = "2"

